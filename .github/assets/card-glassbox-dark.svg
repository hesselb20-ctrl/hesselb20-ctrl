<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 78" width="800" height="78" role="img" aria-label="Glassbox: An interpretability lab Claude Code drives over MCP. Status: Research prototype · v0.1.0">
<style>.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<text x="0" y="32" class="s" font-size="22" font-weight="600" fill="#EDEDED">Glassbox</text>
<text x="0" y="56" class="s" font-size="14" fill="#8C8C8C">An interpretability lab Claude Code drives over MCP.</text>
<circle cx="796" cy="24" r="2.6" fill="#FFFFFF" style="animation:pulse 5s ease-in-out infinite"/><text x="786" y="27.5" class="m" font-size="9.5" fill="#8C8C8C" text-anchor="end">Research prototype · v0.1.0</text>
<text x="800" y="57" class="m" font-size="9.5" fill="#EDEDED" text-anchor="end">Mechanistic interpretability  →</text>
<line x1="0" y1="77" x2="800" y2="77" stroke="#2B2B2B"/>
<rect x="0" y="76" width="28" height="2" fill="#FFFFFF" style="--d:772px;animation:sweep 20s ease-in-out infinite alternate"/>
</svg>